[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "Chaos and reliability experiments for AI agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1"
]

[project.scripts]
reliability-lab = "reliability_lab.experiments.run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
